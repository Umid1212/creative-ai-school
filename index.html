<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Creative AI School</title>

<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b0b10; --card:#15151d; --card2:#1c1c27; --line:#262633;
    --text:#f3f3f7; --muted:#9a9aae; --accent:#8b5cf6; --accent2:#ec4899;
    --nav-h:64px;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{background:var(--bg);color:var(--text);font-family:Manrope,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  body{padding:0 16px calc(var(--nav-h) + 32px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto}
  b{font-weight:700}
  .top{display:flex;justify-content:space-between;align-items:center;padding:16px 0}
  .brand{font-weight:800;font-size:15px}
  .brand span{background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;color:transparent}
  .langs{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:3px}
  .langs button{border:0;background:none;color:var(--muted);font:600 12px Manrope;padding:5px 8px;border-radius:7px;cursor:pointer}
  .langs button.on{background:var(--card2);color:var(--text)}

  .page{display:none;animation:fade .25s ease}
  .page.on{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  h2{font-size:22px;font-weight:800;margin:4px 0 16px;letter-spacing:-.3px}
  h3{font-size:18px;font-weight:800;margin-bottom:8px}

  /* Главная */
  .hero{padding:28px 20px 24px;border-radius:24px;overflow:hidden;margin-bottom:22px;
    background:radial-gradient(120% 90% at 100% 0%,rgba(236,72,153,.35),transparent 60%),
               radial-gradient(100% 80% at 0% 100%,rgba(139,92,246,.45),transparent 60%),var(--card)}
  .hero h1{font-size:28px;line-height:1.15;font-weight:800;letter-spacing:-.5px;margin-bottom:10px}
  .hero p{color:#d6d6e2;font-size:15px;line-height:1.5}
  .stats{display:flex;gap:8px;margin-top:20px}
  .stat{flex:1;background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:10px 6px;text-align:center}
  .stat b{display:block;font-size:20px;font-weight:800}
  .stat small{color:#c9c9d6;font-size:11px}
  .row{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;
    padding:14px;margin-bottom:10px;cursor:pointer;text-align:left;width:100%;color:inherit;font:inherit}
  .row .t{flex:1;font-weight:700;font-size:15px}
  .row .p{font-weight:800;font-size:14px;color:#e9d5ff;white-space:nowrap}
  .row .arr{color:var(--muted)}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 12px}
  .chips span{font-size:12px;font-weight:700;padding:5px 10px;border-radius:99px;background:var(--card2);border:1px solid var(--line);color:#e4e4ee}
  .row .chips{margin:6px 0 0}
  .row .chips span{font-size:11px;padding:3px 8px}
  .row .tw{flex:1;min-width:0}
  .sub{color:var(--muted);font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;margin:6px 0 10px}

  /* Карточки */
  .card{background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden;margin-bottom:14px}
  .card img.cover{width:100%;aspect-ratio:16/9;object-fit:cover;display:block}
  .cbody{padding:16px}
  .desc{color:#cfcfdb;font-size:14px;line-height:1.6;white-space:pre-line}
  .badge{display:inline-block;font-size:11px;font-weight:700;padding:4px 9px;border-radius:99px;margin-bottom:8px;
    background:linear-gradient(90deg,var(--accent),var(--accent2))}
  .ghost{display:block;width:100%;margin-top:14px;padding:12px;border-radius:14px;border:1px solid var(--line);
    background:var(--card2);color:var(--text);font:700 14px Manrope;cursor:pointer}

  /* Цены */
  .plan{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;margin-bottom:14px;position:relative}
  .plan.best{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),0 10px 40px -10px rgba(139,92,246,.55)}
  .plan .old{color:var(--muted);font-size:14px;text-decoration:line-through;margin-top:6px}
  .plan .now{font-size:28px;font-weight:800;letter-spacing:-.5px}
  .per{font-size:13px;font-weight:600;color:var(--muted);letter-spacing:0}
  .row .p{text-align:right}
  .row .per{display:block;font-size:11px}
  .plan .off{position:absolute;top:16px;right:16px;background:rgba(34,197,94,.15);color:#4ade80;font-weight:800;font-size:12px;padding:4px 8px;border-radius:8px}
  .buy{display:block;width:100%;margin-top:14px;border:0;border-radius:14px;padding:14px;font:800 15px Manrope;color:#fff;cursor:pointer;
    background:linear-gradient(90deg,var(--accent),var(--accent2))}
  .buy:active,.ghost:active,.row:active{transform:scale(.98)}
  .cta{margin-top:6px}

  /* CEO */
  .ceo{text-align:center;padding:24px 18px}
  .ceo img{width:120px;height:120px;border-radius:50%;object-fit:cover;border:3px solid var(--accent);margin-bottom:14px}
  .ceo .desc{text-align:left}
  .reviews{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px}
  .reviews img{height:280px;border-radius:14px;scroll-snap-align:start;border:1px solid var(--line)}

  .faq{padding:16px}
  .contact{display:block;text-align:center;color:#fff;text-decoration:none;border-radius:14px;padding:14px;font-weight:800;
    background:linear-gradient(90deg,var(--accent),var(--accent2))}

  /* Админ-панель */
  .astats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
  .astat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px}
  .astat b{display:block;font-size:20px;font-weight:800}
  .astat small{color:var(--muted);font-size:12px}
  .afilters{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px}
  .afilters button{flex-shrink:0;border:1px solid var(--line);background:var(--card);color:var(--muted);
    font:700 13px Manrope;padding:8px 12px;border-radius:99px;cursor:pointer}
  .afilters button.on{background:var(--text);color:var(--bg);border-color:var(--text)}
  .order{display:flex;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px;margin-bottom:10px}
  .order .thumb{width:76px;height:96px;border-radius:12px;object-fit:cover;background:var(--card2);flex-shrink:0;cursor:zoom-in;
    display:flex;align-items:center;justify-content:center;font-size:26px;color:var(--muted)}
  .order .info{flex:1;min-width:0;font-size:13px;line-height:1.5;color:#cfcfdb}
  .order .info .nm{font-size:15px;font-weight:800;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .order .info a{color:#c4b5fd;text-decoration:none;font-weight:700}
  .order .info .amt{color:var(--text);font-weight:800}
  .st{display:inline-block;font-size:11px;font-weight:800;padding:3px 8px;border-radius:8px;margin-top:4px}
  .st.pending{background:rgba(234,179,8,.15);color:#facc15}
  .st.approved{background:rgba(34,197,94,.15);color:#4ade80}
  .st.rejected{background:rgba(239,68,68,.15);color:#f87171}
  .obtns{display:flex;gap:8px;margin-top:10px}
  .obtns button{flex:1;border:0;border-radius:12px;padding:10px 6px;font:800 13px Manrope;cursor:pointer;color:#fff}
  .obtns .ok{background:#16a34a}
  .obtns .no{background:#27272f;color:#f87171;border:1px solid #3f2a2e}
  .obtns button:disabled{opacity:.5}
  .ahead{display:flex;justify-content:space-between;align-items:center}
  .refresh{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:12px;padding:8px 12px;font:700 13px Manrope;cursor:pointer}
  .empty{color:var(--muted);text-align:center;padding:30px 0;font-size:14px}
  .lightbox{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:50;display:none;align-items:center;justify-content:center;padding:16px}
  .lightbox.on{display:flex}
  .lightbox img{max-width:100%;max-height:100%;border-radius:12px}
  nav button{position:relative}
  .dot{position:absolute;top:8px;left:calc(50% + 6px);min-width:17px;height:17px;padding:0 4px;border-radius:9px;
    background:var(--accent2);color:#fff;font:800 10px/17px Manrope;text-align:center}

  /* Нижнее меню */
  nav{position:fixed;left:0;right:0;bottom:0;z-index:10;padding-bottom:env(safe-area-inset-bottom);
    background:rgba(17,17,24,.85);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line)}
  nav .in{max-width:560px;margin:0 auto;display:flex;height:var(--nav-h)}
  nav button{flex:1;border:0;background:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:4px;font:700 10.5px Manrope;cursor:pointer;min-width:0}
  nav button span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;padding:0 2px}
  nav svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
  nav button.on{color:var(--text)}
  nav button.on svg{stroke:url(#g)}
</style>
</head>

const tg = window.Telegram && Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); try{tg.setHeaderColor('#0b0b10');tg.setBackgroundColor('#0b0b10');tg.setBottomBarColor('#111118')}catch(e){} }

const ICONS = {
  home:'<path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/>',
  courses:'<path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 21V5M8 7h7M8 11h7"/>',
  prices:'<path d="M20.6 13.4 13.4 20.6a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8z"/><circle cx="7.5" cy="7.5" r="1.5"/>',
  ceo:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/>',
  faq:'<circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6V14M12 17.5v.01"/>',
  admin:'<path d="M12 3 4 6v6c0 4.5 3.4 8.3 8 9 4.6-.7 8-4.5 8-9V6z"/><path d="m9 12 2 2 4-4"/>'
};
const PAGES = ['home','courses','prices','ceo','faq'];

// ---- админ-панель: видна только админам (проверяет бот по подписи Telegram)
const API = new URLSearchParams(location.search).get('api');
const INIT = tg?.initData || '';
const AT = {
  uz:{title:'Admin panel',pending:'Kutilmoqda',approved:'Tasdiqlangan',rejected:'Rad etilgan',all:'Barchasi',
      sales:'Sotuvlar',revenue:'Daromad',users:'Foydalanuvchilar',ok:'✅ Tasdiqlash',no:'❌ Rad etish',
      confirm_ok:'To\'lovni tasdiqlaysizmi? Mijozga kursga kirish yuboriladi.',confirm_no:'To\'lovni rad etasizmi?',
      empty:'Buyurtmalar yo\'q',nav:'Admin',by:'—'},
  ru:{title:'Админ-панель',pending:'Ожидают',approved:'Одобрены',rejected:'Отклонены',all:'Все',
      sales:'Продажи',revenue:'Выручка',users:'Пользователи',ok:'✅ Одобрить',no:'❌ Отклонить',
      confirm_ok:'Подтвердить оплату? Клиент получит доступ к курсу.',confirm_no:'Отклонить оплату?',
      empty:'Заявок нет',nav:'Админ',by:'—'},
  en:{title:'Admin panel',pending:'Pending',approved:'Approved',rejected:'Rejected',all:'All',
      sales:'Sales',revenue:'Revenue',users:'Users',ok:'✅ Approve',no:'❌ Reject',
      confirm_ok:'Approve this payment? The client will get course access.',confirm_no:'Reject this payment?',
      empty:'No orders',nav:'Admin',by:'—'}
};
let isAdmin = false, aFilter = 'pending', aData = null, aTimer = null;
const at = k => (AT[lang] || AT.ru)[k];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sumFmt = n => n ? n.toLocaleString('ru-RU').replace(/ /g,' ') + " so'm" : '';

async function api(path, opts = {}){
  const r = await fetch(API + path, {...opts, headers:{'X-Init-Data': INIT, ...(opts.headers||{})}});
  const j = await r.json().catch(() => ({}));
  if (!r.ok && !j.error) j.error = 'HTTP ' + r.status;
  return j;
}

async function checkAdmin(){
  if (!API || !INIT) return;
  try {
    const me = await api('/api/me');
    if (!me.admin) return;
    isAdmin = true;
    PAGES.push('admin');
    render();
    await loadOrders();
    if (location.hash === '#admin') go('admin');
  } catch(e) { console.warn('admin check failed', e); }
}

async function loadOrders(){
  const j = await api('/api/orders?status=' + aFilter);
  if (j.error) { $('a_list').innerHTML = `<div class="empty">⚠️ ${esc(j.error)}</div>`; return; }
  aData = j; renderAdmin();
}

function renderAdmin(){
  if (!isAdmin) return;
  $('t_admin').textContent = at('title');
  const s = aData?.stats || {};
  $('a_stats').innerHTML = `
    <div class="astat"><b>${s.pending ?? '–'}</b><small>⏳ ${at('pending')}</small></div>
    <div class="astat"><b>${s.approved ?? '–'}</b><small>✅ ${at('sales')}</small></div>
    <div class="astat"><b>${s.usd != null ? money(s.usd) : '–'}</b><small>💰 ${at('revenue')}${s.uzs ? ' ≈ ' + sumFmt(s.uzs) : ''}</small></div>
    <div class="astat"><b>${s.users ?? '–'}</b><small>👥 ${at('users')}</small></div>`;
  $('a_filters').innerHTML = ['pending','approved','rejected','all'].map(f =>
    `<button data-af="${f}" class="${f===aFilter?'on':''}">${at(f)}</button>`).join('');
  const list = aData?.orders || [];
  $('a_list').innerHTML = list.length ? list.map(o => {
    const d = new Date(o.created_at * 1000);
    const date = d.toLocaleDateString('ru-RU') + ' ' + d.toLocaleTimeString('ru-RU', {hour:'2-digit', minute:'2-digit'});
    const src = `${API}/api/receipt/${o.id}?auth=${encodeURIComponent(INIT)}`;
    return `<div class="order">
      <img class="thumb" src="${src}" data-zoom="${src}" loading="lazy" alt=""
           onerror="this.outerHTML='<div class=&quot;thumb&quot;>📄</div>'">
      <div class="info">
        <div class="nm">#${o.id} · ${esc(o.name || o.user_id)}</div>
        ${o.username ? `<a href="#" data-tg="${esc(o.username)}">@${esc(o.username)}</a><br>` : ''}
        ${esc(tr(o.course))}<br>
        <span class="amt">${money(o.amount)}</span>${o.amount_sum ? ' ≈ ' + sumFmt(o.amount_sum) : ''}<br>
        ${date}<br>
        <span class="st ${o.status}">${at(o.status)}</span>${o.decided_by ? ` <small>${at('by')} ${esc(o.decided_by)}</small>` : ''}
        ${o.status === 'pending' ? `<div class="obtns">
          <button class="ok" data-act="approve" data-id="${o.id}">${at('ok')}</button>
          <button class="no" data-act="reject" data-id="${o.id}">${at('no')}</button></div>` : ''}
      </div></div>`;
  }).join('') : `<div class="empty">${at('empty')}</div>`;
  // счётчик ожидающих на иконке
  const btn = document.querySelector('nav button[data-go="admin"]');
  if (btn) { btn.querySelector('.dot')?.remove(); if (s.pending) btn.insertAdjacentHTML('beforeend', `<span class="dot">${s.pending}</span>`); }
}

function confirmTg(text){
  return new Promise(res => tg?.showConfirm ? tg.showConfirm(text, res) : res(confirm(text)));
}

async function decideOrder(id, act, btn){
  if (!(await confirmTg(at(act === 'approve' ? 'confirm_ok' : 'confirm_no')))) return;
  btn.closest('.obtns').querySelectorAll('button').forEach(b => b.disabled = true);
  const j = await api(`/api/orders/${id}/${act}`, {method:'POST'});
  if (!j.ok) { tg?.showAlert ? tg.showAlert(j.error || 'Error') : alert(j.error); }
  else tg?.HapticFeedback?.notificationOccurred('success');
  await loadOrders();
}

const LANGS = DATA.languages;
const NAMES = {uz:"UZ", ru:"RU", en:"EN"};
let lang = (() => {
  try { const s = localStorage.getItem('lang'); if (s && LANGS.includes(s)) return s; } catch(e){}
  const code = tg?.initDataUnsafe?.user?.language_code || navigator.language || '';
  if (code.startsWith('ru')) return 'ru';
  if (code.startsWith('en') && LANGS.includes('en')) return 'en';
  return LANGS[0];
})();
let page = 'home';

const W = DATA.webapp;
const tr = v => (v && typeof v === 'object') ? (v[lang] || v[LANGS[0]] || '') : (v || '');
const money = n => { const num = n.toLocaleString('ru-RU').replace(/ /g,' ');
  return DATA.currency.length === 1 ? DATA.currency + num : num + ' ' + DATA.currency; };
const per = () => DATA.price_period ? tr(DATA.price_period) : '';
const $ = id => document.getElementById(id);
const chips = c => (c.tools && c.tools.length) ? `<div class="chips">${c.tools.map(x => `<span>${x}</span>`).join('')}</div>` : '';
const isUrl = s => typeof s === 'string' && s.startsWith('http');

function go(p, anchor){
  page = p;
  document.querySelectorAll('.page').forEach(s => s.classList.toggle('on', s.dataset.page === p));
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.go === p));
  tg?.HapticFeedback?.selectionChanged();
  clearInterval(aTimer);
  if (p === 'admin') { loadOrders(); aTimer = setInterval(loadOrders, 20000); }  // автообновление
  if (anchor) $(anchor)?.scrollIntoView({behavior:'smooth', block:'start'});
  else window.scrollTo({top:0, behavior:'smooth'});
}

function buy(id){
  const url = `https://t.me/${DATA.bot_username}?start=buy_${id}`;
  if (tg) { tg.HapticFeedback?.impactOccurred('medium'); tg.openTelegramLink(url); tg.close(); }
  else location.href = url;
}

function render(){
  document.documentElement.lang = lang;
  $('brand').innerHTML = W.brand.replace(/(\S+)$/, '<span>$1</span>');
  $('langs').innerHTML = LANGS.map(l => `<button class="${l===lang?'on':''}" data-l="${l}">${NAMES[l]||l}</button>`).join('');

  // нижнее меню
  $('nav').innerHTML = PAGES.map(p =>
    `<button data-go="${p}" class="${p===page?'on':''}"><svg viewBox="0 0 24 24">${ICONS[p]}</svg><span>${p==='admin' ? at('nav') : tr(W['nav_'+p])}</span></button>`).join('');

  // главная
  $('hero_title').textContent = tr(W.hero_title);
  $('hero_sub').innerHTML = tr(W.hero_sub);
  $('stats').innerHTML = (W.stats||[]).map(s => `<div class="stat"><b>${s.num}</b><small>${tr(s)}</small></div>`).join('');
  $('home_courses_t').textContent = tr(W.courses_title);
  $('home_courses').innerHTML = DATA.courses.map(c =>
    `<button class="row" data-go="courses" data-anchor="c_${c.id}"><span class="tw"><span class="t">${tr(c.title)}</span>${chips(c)}</span><span class="p">${money(c.price)}<small class="per">/${per()}</small></span><span class="arr">›</span></button>`).join('');
  $('home_cta').textContent = tr(W.cta);

  // о курсах
  $('t_courses').textContent = tr(W.nav_courses);
  $('courses').innerHTML = DATA.courses.map(c => `
    <div class="card" id="c_${c.id}">
      ${isUrl(c.photo) ? `<img class="cover" src="${c.photo}" alt="">` : ''}
      <div class="cbody">
        ${c.best ? `<span class="badge">${tr(W.best)}</span>` : ''}
        <h3>${tr(c.title)}</h3>
        ${chips(c)}
        <div class="desc">${tr(c.description)}</div>
        <button class="ghost" data-go="prices" data-anchor="p_${c.id}">${tr(W.see_price)} →</button>
      </div>
    </div>`).join('');

  // цены
  $('t_prices').textContent = tr(W.nav_prices);
  $('prices').innerHTML = DATA.courses.map(c => {
    const off = c.old_price ? Math.round((1 - c.price / c.old_price) * 100) : 0;
    return `
    <div class="plan ${c.best?'best':''}" id="p_${c.id}">
      ${off > 0 ? `<span class="off">−${off}%</span>` : ''}
      ${c.best ? `<span class="badge">${tr(W.best)}</span>` : ''}
      <h3>${tr(c.title)}</h3>
      ${chips(c)}
      ${c.old_price ? `<div class="old">${money(c.old_price)}</div>` : ''}
      <div class="now">${money(c.price)} <small class="per">/ ${per()}</small></div>
      <button class="buy" data-buy="${c.id}">${tr(DATA.texts.btn_buy)}</button>
    </div>`;}).join('');

  // CEO
  const A = DATA.author;
  $('t_ceo').textContent = tr(W.nav_ceo);
  $('ceo').innerHTML = `${isUrl(A.photo) ? `<img src="${A.photo}" alt="">` : ''}<div class="desc">${tr(A.text)}</div>`;
  const media = (DATA.reviews.media||[]).filter(isUrl);
  $('reviews_wrap').style.display = media.length ? '' : 'none';
  $('t_reviews').textContent = tr(DATA.reviews.text);
  $('reviews').innerHTML = media.map(u => `<img src="${u}" alt="" loading="lazy">`).join('');

  // FAQ
  $('t_faq').textContent = tr(W.nav_faq);
  $('faq').innerHTML = tr(DATA.faq);
  $('contact').textContent = tr(DATA.texts.menu_contact) + ' · ' + DATA.manager;
  $('contact').href = 'https://t.me/' + DATA.manager.replace('@','');

  document.querySelectorAll('.page').forEach(s => s.classList.toggle('on', s.dataset.page === page));
  renderAdmin();
}

document.addEventListener('click', e => {
  const lb = e.target.closest('#lightbox');
  if (lb) { lb.classList.remove('on'); return; }
  const z = e.target.closest('[data-zoom]');
  if (z) { $('lightbox').querySelector('img').src = z.dataset.zoom; $('lightbox').classList.add('on'); return; }
  const af = e.target.closest('[data-af]');
  if (af) { aFilter = af.dataset.af; renderAdmin(); loadOrders(); return; }
  const act = e.target.closest('[data-act]');
  if (act) return decideOrder(act.dataset.id, act.dataset.act, act);
  if (e.target.closest('#a_refresh')) { tg?.HapticFeedback?.impactOccurred('light'); return loadOrders(); }
  const tl = e.target.closest('[data-tg]');
  if (tl) { e.preventDefault(); const u = 'https://t.me/' + tl.dataset.tg; return tg ? tg.openTelegramLink(u) : window.open(u); }
  const l = e.target.closest('[data-l]');
  if (l) { lang = l.dataset.l; try{localStorage.setItem('lang', lang)}catch(_){} render(); return; }
  const b = e.target.closest('[data-buy]');
  if (b) return buy(b.dataset.buy);
  const g = e.target.closest('[data-go]');
  if (g) return go(g.dataset.go, g.dataset.anchor);
  const c = e.target.closest('#contact');
  if (c && tg) { e.preventDefault(); tg.openTelegramLink(c.href); }
});
render();
checkAdmin();
</script>
